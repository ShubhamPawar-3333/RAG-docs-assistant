# Ruff configuration.
#
# CI installs ruff unpinned and runs `ruff check src/`. Ruff 0.16 broadened its
# default rule set (adding UP, B, BLE, SIM, I, ...), which silently turned the
# lint job red on a codebase written against the older default. This file pins
# the intended rule set so lint is deterministic across ruff versions.
#
# The selection below is Ruff's classic default (pycodestyle errors + pyflakes).
# Widen it deliberately (e.g. add "I", "UP", "B") in a dedicated cleanup pass,
# not as a side effect of an unrelated ruff upgrade.

line-length = 100
target-version = "py313"

[lint]
select = ["E4", "E7", "E9", "F"]
